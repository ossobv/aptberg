name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # ruff is not in the dev extra; the Makefile runs it from PATH.
      - run: pip install ruff
      - run: make fmt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # gpgv verifies signatures; gpg makes the tests' signing key.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gpg gpgv
      - run: make test
